[Global]
	Name = irc.test.local
	Info = Local test IRC server for skybot
	Listen = 0.0.0.0
	Ports = 6667
	MotdPhrase = Local test IRC server

[Options]
	# Do not print/auth-delay "Looking up your hostname" notices.
	NoticeAuth = no

	# Do not perform reverse DNS lookups for connecting clients.
	DNS = no

	# Do not query identd/auth on connecting clients.
	Ident = no

	# Do not authenticate users via PAM; allow arbitrary test users.
	PAM = no
